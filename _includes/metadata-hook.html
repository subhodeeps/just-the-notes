<!-- Chirpy's placeholder for custom <head> content (included from _includes/head.html) -->

<!-- JetBrains Mono for code (_sass/_code-font.scss); Google Fonts is already preconnected by Chirpy -->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap"
>

<!-- A link into a folded box (<details>), such as a citation that points to the references,
     opens the box first, so that the browser can scroll to the target. -->
<script>
  (function () {
    function openAround(id) {
      var target = id && document.getElementById(id);
      for (var box = target && target.closest('details'); box; box = box.parentElement.closest('details')) {
        box.open = true;
      }
    }
    document.addEventListener('click', function (event) {
      var link = event.target.closest('a[href^="#"]');
      if (link) openAround(decodeURIComponent(link.getAttribute('href').slice(1)));
    });
    document.addEventListener('DOMContentLoaded', function () {
      openAround(decodeURIComponent(location.hash.slice(1)));
    });
  })();
</script>
{% unless jekyll.environment == 'production' %}

<!-- The local preview has no offline cache. Chirpy registers its service worker only in
     production builds, but one that a production build left behind (tools/test.sh builds into the
     same _site) would keep serving old pages and scripts, so the preview removes it. -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (registrations) {
      registrations.forEach(function (registration) {
        registration.unregister();
      });
    });
  }
</script>
{% endunless %}
