<!-- The photon of the marginal pocket (ht_chaos_reproduction), drawn by assets/js/home-hero-pocket.js
     from assets/data/pocket-orbit.json (tools/export_pocket_orbit.py) -->
<figure class="home-hero-figure home-hero-pocket">
  <canvas
    class="home-hero-canvas"
    role="img"
    aria-label="{{ include.alt | escape }}"
    data-src="{{ '/assets/data/pocket-orbit.json' | relative_url }}"
  ></canvas>
  <figcaption>
    Based on Kostaros &amp; Pappas,
    <a href="https://doi.org/10.1088/1361-6382/ac7028"><i>CQG</i> 39, 134001 (2022)</a>,
    <a href="https://arxiv.org/abs/2111.09367">arXiv:2111.09367</a>.
    Simulation and animation are my own.
  </figcaption>
</figure>
<script defer src="{{ '/assets/js/home-hero-pocket.js' | relative_url }}"></script>
